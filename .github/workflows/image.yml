name: image

# Builds the container image on every push and PR.
# Pushes to ghcr.io/lirant10/homelab-status only from master:
#   :latest and :sha-<short commit> (Kubernetes pins the sha tag)
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - the image imports the code
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load -t homelab-status:test .
          docker run --rm -e PROMETHEUS_URL=http://x -e TELEGRAM_TOKEN=x -e TELEGRAM_CHAT_ID=1 \
            homelab-status:test python -c "import homelab, agent, bot, app; print('imports ok')"
